# teapot Configuration

[server]
# Domain for generating links - change this to your own domain/ip
address            = "0.0.0.0"
hostname           = "localhost"
httpMaxConnections = 100
https              = false       # Set to true when using HTTPS
port               = 8080
# Should probably be set if you're using a reverse proxy, or else embed media won't work due to port being inside of the domain. For example og:image will link https://teapot.domain.com:8080 instead of https://teapot.domain.com
# publicPort       = 443 
staticDir          = "./public"
title              = "teapot"

[cache]
# Cache TTL settings (in-process cache, no external dependencies)
listMinutes = 240   # How long to cache list info
maxEntries  = 50000 # Evict the soonest-expiring entries when this limit is exceeded
rssMinutes  = 10    # How long to cache RSS queries

[config]
# Secret key for cryptographic signing of media URLs.
# Generate a unique value for every instance, e.g. with openssl rand -hex 32
hmacKey = ""

# Use base64 encoding for proxied media URLs
base64Media = false

# Enable RSS feeds
enableRSS = true

# Cap how fast one client can spend X API quota. Cache hits, media proxying and
# static assets are never charged, since they cost no upstream call.
clientBudget = true

# Peers whose X-Forwarded-For and X-Real-IP name the real client. Anything not
# listed is billed by its socket address, so behind a reverse proxy this MUST
# list that proxy or every visitor shares one budget. The header is read right
# to left past trusted hops, since proxies append rather than replace.
trustedProxies = [  ]

# Shown when a caller outruns its own budget, when the instance is out of
# upstream quota, and when a request fails outright.
# clientBudgetMessage = "..."
# rateLimitedMessage = "..."
# internalErrorMessage = "..."

# Enable debug endpoints (/.health, /.sessions)
enableDebug = false

# Bearer token required for debug endpoints when enableDebug = true.
# Generate a unique value with at least 32 characters.
debugToken = ""

# HTTP/HTTPS proxy (SOCKS proxies not supported)
proxy     = ""
proxyAuth = ""

# HTTP/HTTPS proxy URL used only for X API requests, e.g. http://localhost:7000
apiProxy = ""

# Enable this if cookie-based auth is failing
disableTid = false

# Read about-account data from X-Posed's public cache before asking X, saving a
# call on the scarcest rate-limit tier. Discloses the usernames being viewed to
# a third party. teapot never contributes to it.
xPosedCommunityCache = false

# Max requests per session to avoid race conditions
maxConcurrentReqs = 2

# Configure server-side Kagi translation for non-English tweets
# Set either kagiToken (inline) or kagiTokenFile (path to file)
# Get your token from kagi.com/settings → Session Link
kagiToken     = ""
kagiTokenFile = ""

[gifTranscoding]
# Transcode Twitter GIF MP4s to actual GIF format for Discord inline playback
# Modes: "local" (default, ffmpeg on server), "off", "external" (URL rewrite)
mode = "local"
# Cache directory for transcoded GIFs (local mode only)
cacheDir = "./cache/gif"
# Maximum cache size in MB (local mode only)
cacheMaxMb = 512
# External transcoding domain (external mode only, e.g. "gif.example.com")
externalDomain = ""

[preferences]
# Default theme
theme = "teapot"

# URL replacements for privacy
replaceReddit  = ""
replaceTwitter = ""
replaceYouTube = ""

infiniteScroll = false
